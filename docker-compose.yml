services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ruby_pos}
      POSTGRES_USER: ${DB_USER:-ruby_pos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ruby_pos}
    # Bound to localhost only, and driven by a variable distinct from
    # DB_PORT (which .env.<environment> also sets, to a *different*
    # value — Postgres's internal container port — for Django's own DB
    # connection). Reusing DB_PORT here previously caused Django's
    # internal-port value to leak into this host-side publish, exposing
    # Postgres on the VPS's public interface (mitigated only by luck of
    # the firewall also blocking it — never rely on that alone).
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  # Only used for staging/production deploys — never started by a plain
  # `docker compose up`, so local dev (manage.py runserver + this file's
  # `db` service) is completely unaffected by anything below.
  # Deploy command: `docker compose -p ruby-<env> --profile deploy
  # --env-file .env.<env> up -d`
  backend:
    profiles: ["deploy"]
    image: ghcr.io/jotace7/ruby-jewelry-pos-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.${DEPLOY_ENV:-staging}
    depends_on:
      - db
    volumes:
      - media:/app/media
    networks:
      - default
      - shared

volumes:
  db_data:
  media:

networks:
  shared:
    name: ${DEPLOY_NETWORK:-ruby-staging}
    external: true
